        value: "true"

      - key: SECRET_KEY
        generateValue: true

      # Configure these in Render before deployment.
      - key: ALLOWED_HOSTS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Render-managed PostgreSQL connection.
      - key: DATABASE_URL
        fromDatabase:
          name: talmedix-db
          property: connectionString

      - key: PYTHON_VERSION
        value: "3.12.3"

      # Verify these settings are supported by backend/core/settings.py.
      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: SESSION_COOKIE_SECURE
        value: "True"

      - key: CSRF_COOKIE_SECURE
        value: "True"

      # Enable HSTS only after verifying the final HTTPS domain.
      - key: SECURE_HSTS_SECONDS
        value: "31536000"

      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"

      - key: SECURE_HSTS_PRELOAD
        value: "False"

      - key: CONSULTATION_FEE
        value: "500.00"

      - key: GST_RATE
        value: "0.18"

databases:
  - name: talmedix-db
    databaseName: talmedix
    user: talmedix_user
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "18"
